<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    #video {
      display: none;
    }
  </style>
</head>

<body>

<div id="container"></div>

<video
  id="video"
  src="video.mp4"
  loop
  muted
  playsinline
  webkit-playsinline
></video>

<script type="module">

import * as THREE from "three";
import { MindARThree } from "mindar-image-three";


// =========================
// MINDAR
// =========================

const mindarThree = new MindARThree({
  container: document.querySelector("#container"),
  imageTargetSrc: "targets.mind"
});

const { renderer, scene, camera } = mindarThree;


// =========================
// VIDEO
// =========================

const video = document.querySelector("#video");

const videoTexture = new THREE.VideoTexture(video);

videoTexture.colorSpace = THREE.SRGBColorSpace;
videoTexture.minFilter = THREE.LinearFilter;
videoTexture.magFilter = THREE.LinearFilter;
videoTexture.generateMipmaps = false;


// =========================
// VIDEO PLANE
// =========================

const geometry = new THREE.PlaneGeometry(1.1, 1.58);

const material = new THREE.MeshBasicMaterial({
  map: videoTexture
});

const videoPlane = new THREE.Mesh(
  geometry,
  material
);


// =========================
// MINDAR TARGET
// =========================

const anchor = mindarThree.addAnchor(0);


// =========================
// SMOOTH GROUP
// =========================

// این گروه حرکت واقعی MindAR را دریافت می‌کند
// ولی با تأخیر بسیار کم و نرم دنبال آن حرکت می‌کند.

const smoothGroup = new THREE.Group();

scene.add(smoothGroup);

smoothGroup.add(videoPlane);


// =========================
// SMOOTHING SETTINGS
// =========================

// عدد بزرگ‌تر = سریع‌تر و نزدیک‌تر به tracking واقعی
// عدد کوچک‌تر = نرم‌تر ولی با lag بیشتر

const positionSmooth = 0.18;
const rotationSmooth = 0.18;
const scaleSmooth = 0.18;


// =========================
// TARGET EVENTS
// =========================

anchor.onTargetFound = () => {
  video.play();

  // هنگام پیدا شدن تارگت، اولین موقعیت را
  // مستقیماً می‌گیریم تا ویدئو از جای اشتباه شروع نشود.

  smoothGroup.position.copy(anchor.group.position);
  smoothGroup.quaternion.copy(anchor.group.quaternion);
  smoothGroup.scale.copy(anchor.group.scale);

  smoothGroup.visible = true;
};


anchor.onTargetLost = () => {
  video.pause();

  smoothGroup.visible = false;
};


// =========================
// START
// =========================

const start = async () => {

  await mindarThree.start();

  renderer.setAnimationLoop(() => {

    // -------------------------
    // POSITION SMOOTHING
    // -------------------------

    smoothGroup.position.lerp(
      anchor.group.position,
      positionSmooth
    );


    // -------------------------
    // ROTATION SMOOTHING
    // -------------------------

    smoothGroup.quaternion.slerp(
      anchor.group.quaternion,
      rotationSmooth
    );


    // -------------------------
    // SCALE SMOOTHING
    // -------------------------

    smoothGroup.scale.lerp(
      anchor.group.scale,
      scaleSmooth
    );


    // -------------------------
    // RENDER
    // -------------------------

    renderer.render(scene, camera);

  });

};

start();

</script>

</body>
</html>
