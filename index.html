<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* فقط ویدیوی خودمان را مخفی می‌کنیم،
       نه ویدیوی دوربین MindAR */
    #video {
      display: none;
    }
  </style>
</head>

<body>

<div id="container"></div>

<video
  id="video"
  src="video.mp4"
  loop
  muted
  playsinline
  webkit-playsinline
></video>

<script type="module">

import * as THREE from "three";
import { MindARThree } from "mindar-image-three";


// -------------------------
// MINDAR
// -------------------------

const mindarThree = new MindARThree({
  container: document.querySelector("#container"),
  imageTargetSrc: "targets.mind",

  warmupTolerance: 5,
  missTolerance: 8,

  positionFilterMinCF: 0.001,
  positionFilterBeta: 1000,

  rotationFilterMinCF: 0.001,
  rotationFilterBeta: 1000,

  scaleFilterMinCF: 0.001,
  scaleFilterBeta: 1000,

  resolution: "1080p"
});

const { renderer, scene, camera } = mindarThree;


// -------------------------
// VIDEO
// -------------------------

const video = document.querySelector("#video");

const videoTexture = new THREE.VideoTexture(video);

videoTexture.colorSpace = THREE.SRGBColorSpace;
videoTexture.minFilter = THREE.LinearFilter;
videoTexture.magFilter = THREE.LinearFilter;
videoTexture.generateMipmaps = false;


// -------------------------
// VIDEO PLANE
// -------------------------

const geometry = new THREE.PlaneGeometry(1.1, 1.58);

const material = new THREE.MeshBasicMaterial({
  map: videoTexture
});

const videoPlane = new THREE.Mesh(
  geometry,
  material
);


// -------------------------
// TARGET
// -------------------------

const anchor = mindarThree.addAnchor(0);

anchor.group.add(videoPlane);


// -------------------------
// TARGET EVENTS
// -------------------------

anchor.onTargetFound = () => {
  video.play();
};

anchor.onTargetLost = () => {
  video.pause();
};


// -------------------------
// START
// -------------------------

const start = async () => {

  await mindarThree.start();

  renderer.setAnimationLoop(() => {
    renderer.render(scene, camera);
  });

};

start();

</script>

</body>
</html>
